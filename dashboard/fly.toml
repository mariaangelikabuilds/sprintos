app = "sprintos-dashboard"
primary_region = "sin"

[env]
  DATA_DIR = "/app/data"
  PORT = "8792"

[mounts]
  source = "sprintos_data"
  destination = "/app/data"

[http_service]
  internal_port = 8792
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
